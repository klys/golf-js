  <script>
    // Si el bundle no llega a evaluarse (red, navegador antiguo), la pantalla
    // de boot estática se convierte en el aviso de error.
    window.addEventListener('error', function (event) {
      if (!event.target || event.target.tagName !== 'SCRIPT') return;
      var status = document.getElementById('bootStatus');
      var bar = document.getElementById('bootProgressBar');
      if (status) status.textContent = 'No se pudo cargar el juego. Recarga la página.';
      if (bar) bar.style.width = '0%';
    }, true);
  </script>
